# Headless Hyprland/wayvnc session. Chrome needs to be told to use
# the native Wayland backend explicitly -- Ozone does not autodetect this
# session (no XDG_SESSION_TYPE=wayland is set by the systemd service), so
# without this flag Chrome silently falls back to XWayland/X11.
--ozone-platform=wayland
# Ozone/Wayland auto-selects XWayland fallback if wayland init fails; keep
# it explicit rather than -hint=auto so a failure is loud, not a silent X11 window.
